[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovision"
version = "0.1.0"
description = "Implement-the-mechanism computer-vision course: transformer era through 2026"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
    "einops>=0.7",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Pretrained-weight libraries: allowed ONLY in clearly marked probe notebooks,
# never in assignment mechanism code (see claude_notes/ARCHITECTURE.md section 4).
probe = ["timm>=1.0", "open_clip_torch>=2.24", "transformers>=4.40"]
# Autonomous-driving libraries (A11.5*).
av = ["nuscenes-devkit>=1.1", "pyquaternion>=0.9", "shapely>=2.0"]
dev = ["pytest>=8.0"]

# nanovision is NOT pip-installed. This file documents the dependency set; the repo
# runs from its root (pythonpath below for tests, `python -m` for scripts). The
# [build-system] / [project] tables are kept only so `pip install -r` style tooling
# can read the dependency list, not so the package is built or installed.

[tool.pytest.ini_options]
# pythonpath puts the repo root on sys.path for the test session so `import
# nanovision` and `import assignments.aXX...` both resolve. The shared-library
# shims (nanovision/primitives.py, attention.py, ...) pull the student's code out
# of the assignment dirs through nanovision/_student.py, keyed on NANOVISION_IMPL.
#
# Run one assignment at a time: `make test A=aXX` / `make verify A=aXX`, or the
# aggregate `make test-all` / `make verify-all` which use one pytest process per
# assignment. Assignments reuse test-file and module basenames (test_shapes.py,
# vit.py, ...) and conftest imports the assignment-local files by bare name, so a
# single shared process would collide; per-assignment processes (prepend import
# mode, the default) keep each isolated.
pythonpath = ["."]
addopts = "-q"
