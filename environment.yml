# Conda environment for nanovision.
# Create with:  conda env create -f environment.yml
# Then:         conda activate nanovision
# There is no install step: the repo runs from its root (pytest puts it on sys.path
# and scripts run as `python -m assignments.aXX.viz`).
#
# Targets a single 12GB GPU (RTX 4080, CUDA 12.x). The tiny gradcheck/shape tests
# also run on CPU. The pip torch wheel on Linux is a CUDA 12.x build by default.
name: nanovision
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Classical SLAM module (a14_*): the mechanism is C++17, so it needs Eigen (header-only)
  # plus a C++17 compiler (system g++/clang++, not a conda package). CMake + pybind11 +
  # the Rerun SDK are in the pip list below.
  - eigen>=3.4
  - pip:
      - torch>=2.2
      - torchvision>=0.17
      - numpy>=1.26
      - einops>=0.7
      - matplotlib>=3.8
      - tqdm>=4.66
      - pytest>=8.0
      # Hungarian matcher in flow-matching (a06_0) and detection (a11):
      - scipy>=1.11
      # probe-only (pretrained weights; notebooks only):
      - timm>=1.0
      - open_clip_torch>=2.24
      - transformers>=4.40
      # autonomous-driving (A11.5*):
      - nuscenes-devkit>=1.1
      - pyquaternion>=0.9
      - shapely>=2.0
      # world models (a12) and VLA (a13): physics sim for training/viz only.
      # Heavy and optional; the graded CPU mechanism tests skip it via importorskip.
      # Uncomment to run those assignments' real-training and viz paths:
      # - dm_control>=1.0
      # classical SLAM module (a14_*): C++ build + bindings, and the Rerun viewer.
      - cmake>=3.22
      - pybind11>=2.11
      - rerun-sdk>=0.18
      # a14 comparison oracles (optional; tests skip cleanly when absent):
      # the from-scratch C++ is what's graded, these are labeled side-by-sides.
      # - gtsam>=4.2      # pose-graph / BA oracle (a14_5)
      # - open3d>=0.18    # ICP / GICP oracle (a14_4)
